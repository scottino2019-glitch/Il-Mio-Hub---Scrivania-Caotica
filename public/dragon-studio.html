        /* --- STILE DRAGHETTO VERDE --- */
:root {
  --bg-color: #171131;
  --bg-darker: #0c0821;
  --dragon-green: #2bd782;
  --dragon-belly: #86e8a4;
  --dragon-muzzle: #adfed1;
  --ear-purple: #925be0;
  --ear-pink: #d8b4f8;
  --horn-yellow: #f5b021;
  --blush-rose: #a78d7e;
  --white: #ffffff;
  --dark: #121016;
}



/* Sfondo con curva scura */
.sky {
  position: absolute;
  width: 100%;
  height: 100%;
  top: 0;
  left: 0;
  z-index: 1;
}

.ground-slope {
  position: absolute;
  bottom: -50px;
  left: -20px;
  width: 120%;
  height: 180px;
  background-color: var(--bg-darker);
  transform: rotate(-8deg);
  border-radius: 50% 50% 0 0;
}

.dragon {
  position: absolute;
  width: 260px;
  height: 320px;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 2;
  animation: idle-float 4s ease-in-out infinite;
}

/* Orecchie grandi */
.ear {
  position: absolute;
  width: 60px;
  height: 130px;
  background: var(--ear-purple);
  border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
  z-index: -1;
}

.left-ear {
  left: -25px;
  top: -10px;
  transform: rotate(-60deg);
}

.right-ear {
  right: -25px;
  top: -10px;
  transform: rotate(60deg);
}

.ear-inside {
  position: absolute;
  width: 38px;
  height: 105px;
  background: var(--ear-pink);
  border-radius: 50%;
  top: 12px;
  left: 11px;
}

/* Cornetti */
.horns {
  position: absolute;
  width: 80px;
  height: 30px;
  top: -15px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 1;
}

.horn {
  position: absolute;
  background: var(--horn-yellow);
  border-radius: 50% 50% 0 0 / 100% 100% 0 0;
}

.left-horn {
  width: 12px;
  height: 24px;
  left: 15px;
  transform: rotate(-20deg);
}

.right-horn {
  width: 12px;
  height: 24px;
  right: 15px;
  transform: rotate(20deg);
}

.center-horn {
  width: 14px;
  height: 12px;
  left: 33px;
  bottom: -3px;
  transform: rotate(180deg);
  clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
}

/* Testa del Draghetto */
.head {
  position: absolute;
  width: 150px;
  height: 140px;
  background: var(--dragon-green);
  border-radius: 50% 50% 48% 48% / 55% 55% 45% 45%;
  top: 5px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 5;
  box-shadow: inset 2px 2px 10px rgba(255,255,255,0.15);
}

/* Corpo e Pancia */
.body-torso {
  position: absolute;
  width: 175px;
  height: 170px;
  background: var(--dragon-green);
  border-radius: 50% 50% 45% 45% / 55% 55% 45% 45%;
  bottom: 35px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 3;
}

.belly {
  position: absolute;
  width: 130px;
  height: 115px;
  background: var(--dragon-belly);
  border-radius: 50%;
  bottom: 5px;
  left: 50%;
  transform: translateX(-50%);
}

/* Occhi lucidi */
.eye {
  position: absolute;
  width: 25px;
  height: 25px;
  background: var(--dark);
  border-radius: 50%;
  top: 40px;
}

.left-eye {
  left: 40px;
}

.right-eye {
  right: 40px;
}

.glint {
  position: absolute;
  background: var(--white);
  border-radius: 50%;
}

.large-glint {
  width: 10px;
  height: 10px;
  top: 3px;
  right: 3px;
}

.small-glint {
  width: 5px;
  height: 5px;
  bottom: 3px;
  left: 4px;
}

/* Guance rosate */
.blush {
  position: absolute;
  width: 22px;
  height: 12px;
  background: var(--blush-rose);
  border-radius: 50%;
  opacity: 0.85;
  top: 65px;
}

.left-blush {
  left: 20px;
}

.right-blush {
  right: 20px;
}

/* Muso del Drago */
.muzzle {
  position: absolute;
  width: 80px;
  height: 42px;
  background: var(--dragon-muzzle);
  border-radius: 50%;
  top: 65px;
  left: 50%;
  transform: translateX(-50%);
}

.nostril {
  position: absolute;
  width: 6px;
  height: 6px;
  background: var(--dragon-green);
  border-radius: 50%;
  top: 16px;
}

.left-nostril {
  left: 26px;
}

.right-nostril {
  right: 26px;
}

/* Bocca/Becco a triangolo */
.mouth-beak {
  position: absolute;
  width: 14px;
  height: 14px;
  background: var(--horn-yellow);
  clip-path: polygon(50% 100%, 0 0, 100% 0);
  top: 96px;
  left: 50%;
  transform: translateX(-50%);
}

/* Coda con spine sulla destra */
.tail-section {
  position: absolute;
  width: 100px;
  height: 90px;
  right: -5px;
  bottom: 45px;
  z-index: 1;
}

.tail-body {
  position: absolute;
  width: 70px;
  height: 70px;
  background: var(--dragon-green);
  border-radius: 50%;
  right: 15px;
  bottom: 5px;
}

.spike {
  position: absolute;
  width: 16px;
  height: 20px;
  background: var(--horn-yellow);
  z-index: 2;
}

.spike-1 {
  right: 10px;
  bottom: 45px;
  transform: rotate(45deg);
  clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
}

.spike-2 {
  right: -2px;
  bottom: 22px;
  transform: rotate(75deg);
  clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
}

/* Piedini con unghie bianche croccanti */
.foot {
  position: absolute;
  width: 50px;
  height: 48px;
  background: var(--dragon-green);
  border-radius: 50%;
  bottom: -15px;
  z-index: 4;
}

.left-foot {
  left: 20px;
}

.right-foot {
  right: 105px;
}

.toes {
  position: absolute;
  display: flex;
  justify-content: space-between;
  width: 38px;
  top: -4px;
  left: 6px;
}

.toe {
  width: 11px;
  height: 11px;
  background: var(--white);
  border-radius: 50%;
}

/* Animazione di galleggiamento idle */
@keyframes idle-float {
  0%, 100% {
    transform: translate(-50%, 0);
  }
  50% {
    transform: translate(-50%, -8px);
  }
}
