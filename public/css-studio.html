<body>
  <!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CSS Tab Editor</title>
<style>
:root{--bg:#111224;--panel:#1c1a36;--text:#f5f4ff;--muted:#b7b2df;--line:rgba(255,255,255,.1);--accent:#7bf08a;--accent2:#89a9ff}
*{box-sizing:border-box} html,body{height:100%} body{margin:0;font-family:Inter,system-ui,sans-serif;background:radial-gradient(circle at top,#2d285c 0%,var(--bg) 50%);color:var(--text);padding:12px;overflow:hidden}
.app{height:calc(100vh - 24px);display:grid;grid-template-columns:minmax(760px,1fr) minmax(760px,1fr);gap:12px}
.panel{background:rgba(28,26,54,.96);border:1px solid var(--line);border-radius:18px;box-shadow:0 14px 34px rgba(0,0,0,.28);min-height:0;overflow:hidden}
.panel-inner{height:100%;display:flex;flex-direction:column;padding:14px;min-height:0}
.header{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:10px;flex:0 0 auto} h1{margin:0;font-size:1.1rem;line-height:1.1}.hint{margin-top:6px;color:var(--muted);font-size:.86rem;line-height:1.35;max-width:54ch}
.pill{font-size:.78rem;color:#d9d6ff;border:1px solid var(--line);background:rgba(255,255,255,.03);padding:6px 10px;border-radius:999px;white-space:nowrap}
.tabs{display:flex;gap:8px;margin:8px 0 10px;flex:0 0 auto}.tab{border:1px solid var(--line);background:#2a2550;color:var(--text);border-radius:999px;padding:10px 14px;cursor:pointer;font-weight:700}.tab.active{background:var(--accent2);color:#0f1730}
.editor-wrap{display:flex;flex-direction:column;gap:10px;flex:1 1 auto;min-height:0}
.editor{flex:1 1 auto;min-height:0;width:100%;resize:none;border-radius:16px;border:1px solid var(--line);background:#0f0d1f;color:#ffffff;padding:16px;font:inherit;line-height:1.75;font-family:ui-monospace, SFMono-Regular, Menlo, monospace;font-size:17px;outline:none;overflow:auto;tab-size:2;caret-color:#fff}
.editor:focus{box-shadow:0 0 0 2px rgba(137,169,255,.25)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;flex:0 0 auto}.action{border:0;border-radius:999px;padding:10px 14px;cursor:pointer;background:#342f67;color:var(--text)}.action.primary{background:var(--accent);color:#132218;font-weight:800}.action.ghost{background:transparent;border:1px solid var(--line)}
.status{color:var(--muted);font-size:.9rem;min-height:1.3em;flex:0 0 auto}
.preview-wrap{height:100%;display:flex;flex-direction:column;min-height:0;padding:14px}.preview-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex:0 0 auto;margin-bottom:10px}.badge{background:rgba(122,180,255,.14);color:#dbe8ff;border:1px solid rgba(122,180,255,.24);padding:7px 10px;border-radius:999px;font-size:.82rem;white-space:nowrap}
.stage{position:relative;flex:1 1 auto;min-height:0;border-radius:22px;overflow:hidden;border:1px solid var(--line);background:linear-gradient(180deg,#2b2658 0%, #181533 100%)}
.stage::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px);background-size:32px 32px;opacity:.35}
.errorbox{flex:0 0 110px;margin-top:10px;background:#100d21;border:1px solid var(--line);border-radius:16px;padding:12px;color:#d8ffd9;font-family:ui-monospace, monospace;white-space:pre-wrap;overflow:auto;font-size:14px}
.canvas{position:relative;width:100%;height:100%;min-height:100%;background:#1a1733}
.monster{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:360px;height:420px}
.monster div{position:absolute}
.ear{top:6px;width:46px;height:132px;background:#ceb4ff;border-radius:55% 45% 50% 50%}
.ear::before{content:'';position:absolute;inset:14px 11px 12px 11px;background:#f5e7ff;border-radius:inherit}
.ear-left{left:42px;transform:rotate(22deg)}
.ear-right{right:42px;transform:rotate(-22deg)}
.arm{top:170px;width:42px;height:108px;background:#4fe081;border-radius:40px}
.arm-left{left:86px;transform:rotate(18deg)}
.arm-right{right:86px;transform:rotate(-18deg)}
.body{left:104px;top:140px;width:152px;height:182px;background:#4fe081;border-radius:44% 44% 40% 40%}
.belly{left:129px;top:177px;width:102px;height:126px;background:#b7f4bf;border-radius:50%}
.leg{top:292px;width:56px;height:74px;background:#d7f8db;border-radius:45% 45% 38% 38%}
.leg-left{left:110px}
.leg-right{right:110px}
.head{left:109px;top:86px;width:142px;height:120px;background:#4fe081;border-radius:50%}
.eye{top:124px;width:24px;height:28px;background:#17212b;border-radius:50%}
.eye::before{content:'';position:absolute;left:8px;top:7px;width:7px;height:7px;background:#fff;border-radius:50%}
.eye-left{left:138px}
.eye-right{left:202px}
.nose{left:170px;top:150px;width:22px;height:14px;background:#d9f7dd;border-radius:40% 40% 50% 50%}
@media (max-width:1200px){body{overflow:auto}.app{height:auto;grid-template-columns:1fr}.panel{min-height:720px}.editor{font-size:16px;min-height:360px}.stage{min-height:520px}}
</style>
</head>
<body>
<main class="app">
<section class="panel"><div class="panel-inner">
<div class="header"><div><h1>Editor</h1><div class="hint">Cambia il tab per vedere HTML o CSS. L'editor deve occupare quasi tutto lo spazio disponibile.</div></div><div><span class="pill">tab intercambiabili</span></div></div>
<div class="tabs"><button class="tab active" id="htmlTab">HTML</button><button class="tab" id="cssTab">CSS</button></div>
<div class="editor-wrap"><textarea class="editor" id="editor" spellcheck="false"></textarea><div class="toolbar"><button class="action primary" id="renderBtn">Aggiorna ora</button><button class="action" id="sampleBtn">Esempio</button><button class="action ghost" id="clearBtn">Pulisci</button></div><div class="status" id="status">Pronto.</div></div>
</div></section>
<section class="panel"><div class="preview-wrap">
<div class="preview-head"><div><h1 style="margin:0;font-size:1.1rem;">Anteprima grande</h1><div class="hint">Deve restare visibile e non tagliata, con aggiornamento automatico mentre scrivi.</div></div><span class="badge">auto update</span></div>
<div class="stage" id="stage"></div>
<div class="errorbox" id="debugBox">Nessun errore.</div>
</div></section>
</main>
<script>
const htmlTab=document.getElementById('htmlTab'),cssTab=document.getElementById('cssTab'),editor=document.getElementById('editor'),stage=document.getElementById('stage'),debugBox=document.getElementById('debugBox'),statusEl=document.getElementById('status'),renderBtn=document.getElementById('renderBtn'),sampleBtn=document.getElementById('sampleBtn'),clearBtn=document.getElementById('clearBtn');
const sampleHTML=`<div class="canvas">
  <div class="monster">
    <div class="ear ear-left"></div>
    <div class="ear ear-right"></div>
    <div class="arm arm-left"></div>
    <div class="arm arm-right"></div>
    <div class="body"></div>
    <div class="belly"></div>
    <div class="leg leg-left"></div>
    <div class="leg leg-right"></div>
    <div class="head"></div>
    <div class="eye eye-left"></div>
    <div class="eye eye-right"></div>
    <div class="nose"></div>
  </div>
</div>`;
const sampleCSS=`.canvas {
  position: relative;
  width: 100%;
  height: 100%;
  min-height: 100%;
  background: #1a1733;
}

.monster {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: 360px;
  height: 420px;
}

.monster div {
  position: absolute;
}

.ear {
  top: 6px;
  width: 46px;
  height: 132px;
  background: #ceb4ff;
  border-radius: 55% 45% 50% 50%;
}

.ear::before {
  content: '';
  position: absolute;
  inset: 14px 11px 12px 11px;
  background: #f5e7ff;
  border-radius: inherit;
}

.ear-left { left: 42px; transform: rotate(22deg); }
.ear-right { right: 42px; transform: rotate(-22deg); }

.arm {
  top: 170px;
  width: 42px;
  height: 108px;
  background: #4fe081;
  border-radius: 40px;
}

.arm-left { left: 86px; transform: rotate(18deg); }
.arm-right { right: 86px; transform: rotate(-18deg); }

.body {
  left: 104px;
  top: 140px;
  width: 152px;
  height: 182px;
  background: #4fe081;
  border-radius: 44% 44% 40% 40%;
}

.belly {
  left: 129px;
  top: 177px;
  width: 102px;
  height: 126px;
  background: #b7f4bf;
  border-radius: 50%;
}

.leg {
  top: 292px;
  width: 56px;
  height: 74px;
  background: #d7f8db;
  border-radius: 45% 45% 38% 38%;
}

.leg-left { left: 110px; }
.leg-right { right: 110px; }

.head {
  left: 109px;
  top: 86px;
  width: 142px;
  height: 120px;
  background: #4fe081;
  border-radius: 50%;
}

.eye {
  top: 124px;
  width: 24px;
  height: 28px;
  background: #17212b;
  border-radius: 50%;
}

.eye::before {
  content: '';
  position: absolute;
  left: 8px;
  top: 7px;
  width: 7px;
  height: 7px;
  background: #fff;
  border-radius: 50%;
}

.eye-left { left: 138px; }
.eye-right { left: 202px; }

.nose {
  left: 170px;
  top: 150px;
  width: 22px;
  height: 14px;
  background: #d9f7dd;
  border-radius: 40% 40% 50% 50%;
}`;
let mode='html',timer=null,html=sampleHTML,css=sampleCSS;editor.value=html;
function apply(){if(mode==='html') html=editor.value; else css=editor.value; stage.innerHTML=html; let s=document.getElementById('sandbox-style'); if(!s){s=document.createElement('style'); s.id='sandbox-style'; document.head.appendChild(s)} s.textContent=css; debugBox.textContent='Preview aggiornata.'; statusEl.textContent='Aggiornato automaticamente.'}
function setMode(m){mode=m; htmlTab.classList.toggle('active',m==='html'); cssTab.classList.toggle('active',m==='css'); editor.value=m==='html'?html:css; statusEl.textContent=m==='html'?'Modalità HTML':'Modalità CSS'; editor.focus()}
function live(){clearTimeout(timer); timer=setTimeout(apply,80)}
htmlTab.addEventListener('click',()=>setMode('html')); cssTab.addEventListener('click',()=>setMode('css')); editor.addEventListener('input',live); renderBtn.addEventListener('click',apply); sampleBtn.addEventListener('click',()=>{html=sampleHTML; css=sampleCSS; editor.value=mode==='html'?html:css; apply()}); clearBtn.addEventListener('click',()=>{html=''; css=''; editor.value=''; stage.innerHTML=''; debugBox.textContent='Area pulita.'; statusEl.textContent='Pulisci completato.'; apply()}); apply();
</script>
</body>
</html>

    document.addEventListener('DOMContentLoaded', () => {

</body>
</html>
