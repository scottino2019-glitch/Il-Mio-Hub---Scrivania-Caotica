<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iPhone Social & Style Hub</title>
    <meta name="description" content="iPhone Social & Style Hub per creare post, video, reel e card per i social.">
    <meta property="og:title" content="iPhone Social & Style Hub">
    <meta property="og:description" content="iPhone Social & Style Hub per creare post, video, reel e card per i social.">
    <meta property="og:type" content="website">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background: url('https://images.unsplash.com/photo-1611162617213-7d7a39e9b1d7?crop=entropy&cs=srgb&fm=jpg&ixid=M3w4MDc1Mjd8MHwxfHNlYXJjaHw5fHxzb2NpYWx8ZW58MHx8fHwxNzg2NzMzMzQ0fDA&ixlib=rb-4.1.0&q=85') center/cover no-repeat fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #fff;
            overflow-x: hidden;
        }

        /* Ambient Glow behind iPhone */
        .ambient-glow {
            position: absolute;
            width: 520px;
            height: 520px;
            background: radial-gradient(circle, rgba(236,72,153,0.28) 0%, rgba(99,102,241,0.18) 45%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            pointer-events: none;
            filter: blur(45px);
        }

        /* Authentic iPhone Frame */
        .iphone-container {
            position: relative;
            z-index: 1;
            width: 420px;
            height: 870px;
            background: #000;
            border-radius: 56px;
            box-shadow: 
                0 0 0 4px #2c2c2e,
                0 0 0 7px #1c1c1e,
                0 25px 65px rgba(0, 0, 0, 0.85),
                0 0 80px rgba(168, 85, 247, 0.22);
            overflow: hidden;
            border: 12px solid #000;
            display: flex;
            flex-direction: column;
        }

        /* Dynamic Island */
        .dynamic-island {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            width: 125px;
            height: 32px;
            background-color: #000;
            border-radius: 20px;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }

        .dynamic-island.expanded {
            width: 240px;
            height: 38px;
            padding: 0 16px;
        }

        .dynamic-island .island-content {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            font-weight: 600;
            color: #fff;
            opacity: 0;
            transition: opacity 0.2s ease 0.1s;
        }

        .dynamic-island.expanded .island-content {
            opacity: 1;
        }

        .camera-lens {
            width: 12px;
            height: 12px;
            background-color: #0d0d11;
            border-radius: 50%;
            border: 2px solid #1f1f27;
            position: absolute;
            right: 12px;
        }

        /* Status Bar */
        .status-bar {
            height: 46px;
            padding: 14px 28px 0 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            font-weight: 600;
            color: #fff;
            z-index: 90;
        }

        .status-bar .icons {
            display: flex;
            gap: 7px;
            align-items: center;
            font-size: 12px;
        }

        /* Screen Content Area (Home Screen) */
        .screen-content {
            flex: 1;
            background: linear-gradient(180deg, rgba(30,27,75,0.65) 0%, rgba(15,23,42,0.92) 100%),
                        url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1000&auto=format&fit=crop') center/cover;
            padding: 14px 20px 18px 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Widget Header (Originale ripristinato) */
        .widget-header {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 24px;
            padding: 16px 18px;
            color: #fff;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
            transition: transform 0.2s ease;
        }

        .widget-header:hover {
            transform: scale(1.01);
        }

        .widget-header h1 {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -0.5px;
            line-height: 1.2;
            color: #fff;
        }

        .widget-header p {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.75);
            margin-top: 4px;
            text-align: center;
        }

        /* Main Home Screen Grid (3 Colonne di App) */
        .home-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px 10px;
            padding: 8px 4px;
            justify-items: center;
        }

        /* Single App Item (Come un vero iPhone) */
        .app-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #fff;
            transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.18s ease;
            width: 82px;
            text-align: center;
        }

        .app-item:hover {
            transform: translateY(-4px) scale(1.05);
            filter: brightness(1.12);
        }

        .app-item:active {
            transform: scale(0.9);
        }

        /* Icona App Apple Squircle */
        .app-icon {
            width: 62px;
            height: 62px;
            border-radius: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 26px;
            color: #ffffff;
            box-shadow: 
                0 6px 18px rgba(0, 0, 0, 0.38),
                inset 0 1px 1px rgba(255, 255, 255, 0.35);
            position: relative;
            overflow: hidden;
        }

        /* App Label in puro stile iOS */
        .app-label {
            font-size: 11.5px;
            margin-top: 6px;
            text-align: center;
            font-weight: 500;
            color: #ffffff;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.85);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
            letter-spacing: -0.1px;
        }

        /* --- Sfumature Personalizzate per le Icone --- */

        /* 1. Facebook */
        .bg-facebook {
            background: linear-gradient(135deg, #1877f2, #0052cc);
        }

        /* 2. TikTok */
        .bg-tiktok {
            background: #000000;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .bg-tiktok i {
            text-shadow: -2px -1px 0 #25f4ee, 2px 1px 0 #fe2c55;
        }

        /* 3. Storie (Instagram) */
        .bg-instagram {
            background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285AEB 90%);
        }

        /* 4. Text Studio */
        .bg-text-studio {
            background: linear-gradient(135deg, #8b5cf6, #6366f1);
        }

        /* 5. Type Studio */
        .bg-type-studio {
            background: linear-gradient(135deg, #ec4899, #f43f5e);
        }

        /* 6. Kaomoji */
        .bg-kaomoji {
            background: linear-gradient(135deg, #06b6d4, #3b82f6);
        }

        /* 7. Post Maker (Nuova App 1: Post) */
        .bg-post-maker {
            background: linear-gradient(135deg, #ff5722, #ff9800);
        }

        /* 8. Card Studio (Nuova App 2: Card) */
        .bg-card-studio {
            background: linear-gradient(135deg, #7c3aed, #c026d3);
        }

        /* 9. Post & Card (Nuova App 3: Post & Card) */
        .bg-post-card {
            background: linear-gradient(135deg, #059669, #10b981);
        }

        /* Indicatore Pagine Home (I pallini stile iOS) */
        .page-dots {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            margin: 4px 0 8px 0;
        }

        .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.35);
            transition: all 0.2s ease;
        }

        .dot.active {
            width: 18px;
            border-radius: 4px;
            background: #ffffff;
        }

        /* Dock Bar Inferiore Glassmorphism */
        .dock-container {
            background: rgba(255, 255, 255, 0.22);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 30px;
            padding: 10px 14px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        .dock-container .app-item {
            width: auto;
        }

        .dock-container .app-icon {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            font-size: 24px;
        }

        /* Home Indicator Barra Bianca */
        .home-indicator {
            width: 135px;
            height: 5px;
            background-color: #ffffff;
            border-radius: 3px;
            margin: 8px auto 2px auto;
            opacity: 0.85;
            flex-shrink: 0;
        }
    </style>
</head>
<body>

    <div class="ambient-glow" id="ambient-glow"></div>

    <div class="iphone-container" id="iphone-container">
        <!-- Dynamic Island -->
        <div class="dynamic-island" id="dynamic-island" title="Tocca per espandere">
            <div class="island-content" id="island-content">
                <i class="fa-solid fa-sparkles text-pink-400"></i>
                <span>✨ 𝓢𝓸𝓬𝓲𝓪𝓵 𝓗𝓾𝓫 ✨</span>
            </div>
            <div class="camera-lens" id="camera-lens"></div>
        </div>

        <!-- Status Bar -->
        <div class="status-bar" id="status-bar">
            <span id="current-time">9:41</span>
            <div class="icons" id="status-icons">
                <i class="fa-solid fa-signal"></i>
                <i class="fa-solid fa-wifi"></i>
                <i class="fa-solid fa-battery-full"></i>
            </div>
        </div>

        <!-- Screen Content Area -->
        <div class="screen-content" id="screen-content">
            
            <!-- Welcome Header Widget (Titolo Originale Ripristinato) -->
            <div class="widget-header" id="widget-header">
                <h1 id="widget-title">✨ 𝓢𝓸𝓬𝓲𝓪𝓵 𝓗𝓾𝓫 ✨</h1>
                <p id="widget-subtitle">Crea Post, Video, Reel per i siti e social</p>
            </div>

            <!-- Home Screen App Grid (9 App iconiche su 3 righe perfette) -->
            <div class="home-grid" id="home-grid">
                
                <!-- RIGA 1: SOCIAL NETWORK -->
                
                <!-- 1. Facebook -->
                <a href="https://facebook-page-feed-builder.vercel.app/" target="_blank" rel="noopener noreferrer" class="app-item" id="app-facebook">
                    <div class="app-icon bg-facebook">
                        <i class="fa-brands fa-facebook-f"></i>
                    </div>
                    <span class="app-label">Facebook</span>
                </a>

                <!-- 2. TikTok -->
                <a href="https://tik-tok-reels-social-video-maker.vercel.app/" target="_blank" rel="noopener noreferrer" class="app-item" id="app-tiktok">
                    <div class="app-icon bg-tiktok">
                        <i class="fa-brands fa-tiktok"></i>
                    </div>
                    <span class="app-label">TikTok</span>
                </a>

                <!-- 3. Storie (Instagram) -->
                <a href="https://angolo-social.vercel.app/" target="_blank" rel="noopener noreferrer" class="app-item" id="app-storie">
                    <div class="app-icon bg-instagram">
                        <i class="fa-brands fa-instagram"></i>
                    </div>
                    <span class="app-label">Storie</span>
                </a>

                <!-- RIGA 2: STILE & TESTI -->

                <!-- 4. Text Studio -->
                <a href="https://social-text-studio.vercel.app" target="_blank" rel="noopener noreferrer" class="app-item" id="app-text-studio">
                    <div class="app-icon bg-text-studio">
                        <i class="fa-solid fa-font"></i>
                    </div>
                    <span class="app-label">Text Studio</span>
                </a>

                <!-- 5. Type Studio -->
                <a href="https://social-type-studio.vercel.app/" target="_blank" rel="noopener noreferrer" class="app-item" id="app-type-studio">
                    <div class="app-icon bg-type-studio">
                        <i class="fa-solid fa-wand-magic-sparkles"></i>
                    </div>
                    <span class="app-label">Type Studio</span>
                </a>

                <!-- 6. Kaomoji -->
                <a href="https://kaomoji-studio.vercel.app/" target="_blank" rel="noopener noreferrer" class="app-item" id="app-kaomoji">
                    <div class="app-icon bg-kaomoji">
                        <i class="fa-solid fa-face-smile-beam"></i>
                    </div>
                    <span class="app-label">Kaomoji</span>
                </a>

                <!-- RIGA 3: NUOVE APP DEDICATE A POST & CARD -->

                <!-- 7. Post Maker (Nuova App: Post) -->
                <a href="https://ocial-post-creator.vercel.app/" target="_blank" rel="noopener noreferrer" class="app-item" id="app-post-maker">
                    <div class="app-icon bg-post-maker">
                        <i class="fa-solid fa-signs-post"></i>
                    </div>
                    <span class="app-label">Social Post</span>
                </a>

                <!-- 8. Card Studio (Nuova App: Card) -->
                <a href="https://emoji-css-creator.vercel.app/" target="_blank" rel="noopener noreferrer" class="app-item" id="app-card-studio">
                    <div class="app-icon bg-card-studio">
                        <i class="fa-solid fa-id-card"></i>
                    </div>
                    <span class="app-label">Text Card</span>
                </a>

                <!-- 9. Post & Card (Nuova App: Post & Card) -->
                <a href="https://social-toolkit-orcin.vercel.app/" target="_blank" rel="noopener noreferrer" class="app-item" id="app-post-card">
                    <div class="app-icon bg-post-card">
                        <i class="fa-solid fa-layer-group"></i>
                    </div>
                    <span class="app-label">Social Toolkit</span>
                </a>

            </div>

            <!-- Page Dots Indicator -->
            <div class="page-dots" id="page-dots">
                <span class="dot active"></span>
                <span class="dot"></span>
            </div>

            <!-- Dock Bar Inferiore (4 Icone Rapide) -->
            <div class="dock-container" id="dock-bar">
                <!-- Dock 1: Pen Nib -->
                <a href="https://generatore-di-scritte-e-font-specia.vercel.app/" target="_blank" rel="noopener noreferrer" class="app-item" id="dock-pen" title="Generatore Scritte">
                    <div class="app-icon bg-instagram">
                        <i class="fa-solid fa-pen-nib"></i>
                    </div>
                </a>
                <!-- Dock 2: Font -->
                <a href="https://fanzy-test-e-font-generetor.vercel.app/" target="_blank" rel="noopener noreferrer" class="app-item" id="dock-font" title="Fancy Font">
                    <div class="app-icon bg-tiktok">
                        <i class="fa-solid fa-font"></i>
                    </div>
                </a>
                <!-- Dock 3: 3D Motion -->
                <a href="https://text-motion-3d.vercel.app/" target="_blank" rel="noopener noreferrer" class="app-item" id="dock-cube" title="Text Motion 3D">
                    <div class="app-icon bg-text-studio">
                        <i class="fa-solid fa-cube"></i>
                    </div>
                </a>
                <!-- Dock 4: Desk Hub -->
                <a href="https://il-mio-hub-scrivania-caotica.vercel.app/" target="_blank" rel="noopener noreferrer" class="app-item" id="dock-desk" title="Scrivania Caotica">
                    <div class="app-icon bg-facebook">
                        <i class="fa-solid fa-house-laptop"></i>
                    </div>
                </a>
            </div>

            <!-- Home Indicator -->
            <div class="home-indicator" id="home-indicator"></div>

        </div>
    </div>

    <script>
        // Aggiorna l'orario della status bar in tempo reale
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const el = document.getElementById('current-time');
            if (el) el.textContent = `${hours}:${minutes}`;
        }
        updateClock();
        setInterval(updateClock, 1000);

        // Interattività Dynamic Island (espansione al tocco)
        const island = document.getElementById('dynamic-island');
        if (island) {
            island.addEventListener('click', () => {
                island.classList.toggle('expanded');
            });
        }
    </script>
</body>
</html>
